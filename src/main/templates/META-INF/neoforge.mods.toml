modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

# 当前无 mixin 注入（26.2 目标类/签名大量变更，旧 mixin 已全部移入 _ref/legacy）。
# 重新启用注入时：在 src/main/resources 放置 mixin 配置文件，并在此追加对应的声明段。

[[mods]]
modId = "ribbon"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
description = '''
Ribbon - client-side HUD, visual and quality-of-life enhancements for Minecraft 26.2.
Requires Sodium 26.2 as the rendering engine; this mod contains no Sodium source code.
'''
credits = "follish0s, embeddedt"
authors = "follish0s"

[[dependencies.ribbon]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ribbon]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 渲染器由官方 Sodium 26.2 提供，Ribbon 只作为附加 mod 运行
[[dependencies.ribbon]]
modId = "sodium"
type = "required"
ordering = "AFTER"
side = "CLIENT"
