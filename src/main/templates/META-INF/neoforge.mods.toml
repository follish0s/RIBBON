modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mixins]]
config = "ribbon.mixins.json"

[[mods]]
modId = "ribbon"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
description = '''
Ribbon - client-side HUD, visual and quality-of-life enhancements for Minecraft 26.2.
Requires Sodium 26.2 as the rendering engine; this mod contains no Sodium source code.
'''
credits = "follish0s, embeddedt"
authors = "follish0s"

[[dependencies.ribbon]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ribbon]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 渲染器由官方 Sodium 26.2 提供，Ribbon 只作为附加 mod 运行
[[dependencies.ribbon]]
modId = "sodium"
type = "required"
ordering = "AFTER"
side = "CLIENT"
