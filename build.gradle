plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ribbon'
}

// Minecraft 26.2 随附 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    // NeoForm 26.2 依赖的 minecraft-dependencies BOM 在该镜像的根 mojang-meta 路径
    maven { url = 'https://neoforged.forgecdn.net/mojang-meta' }
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // 音乐播放器需要 JLayer，打包进 jar
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    // Lombok 1.18.30 在 Java 25 下抛 ExceptionInInitializerError；改用支持 JDK 25 的版本
    // （RenderSection / TerrainRenderPass 仍使用 @Getter / @Builder 等注解）
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'
    // MixinExtras 由 NeoForge 26.2 自带；若编译报缺类再显式声明版本
    // implementation "io.github.llamalad7:mixinextras-neoforge:<26.2 对应版本>"
    // Sodium 26.2 配置 API（ConfigEntryPoint / ConfigBuilder）：仅编译期引用，
    // 运行时由实例内的 Sodium 提供，不进 mod jar。
    compileOnly files('libs/sodium26-api.jar')
    // Fabric 侧 API：仅编译期引用，运行时由 fabric-loader / fabric-api 提供。
    // 26.2 起游戏不再混淆（无 intermediary），两侧运行时均为官方映射，因此同一份
    // 字节码可以同时在 NeoForge 与 Fabric 上运行 —— 这是「单 jar 双平台」的前提。
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// Fabric 平台实现单独一个源集：只有 fabric.mod.json 声明的入口类会碰 fabric API，
// NeoForge 侧永远不会加载它们，反之亦然。
sourceSets {
    fabric {
        // 默认源目录即 src/fabric/java 与 src/fabric/resources
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 26.2 MDK 官方做法：从 src/main/templates 生成简化版 neoforge.mods.toml
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// JLayer 打包进 Ribbon jar。Gradle 9 禁止在配置阶段解析 runtimeClasspath，
// 必须用 from({ ... }) 延迟求值（1.21.1 版的配置期写法在 Gradle 9 会直接报错）。
tasks.jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 双平台通用 jar：Fabric 平台实现（入口类 + fabric.mod.json）打进同一个 jar。
    from(sourceSets.fabric.output)
    from({
        configurations.runtimeClasspath
                .filter { it.name.startsWith('jlayer') }
                .collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'module-info.class'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 移植阶段需要完整错误清单，javac 默认只报 100 个
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
